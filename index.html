<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c0392b">
<meta name="description" content="Learn about Bihar's history, great people and culture in Hindi, English and Bhojpuri, with a fun quiz.">
<title>Bihar Heritage | बिहार धरोहर</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fff8ee; color: #333; }
  .top { position: sticky; top: 0; z-index: 2; }
  header { background: #c0392b; color: #fff; padding: 12px 14px; text-align: center; }
  header h1 { font-size: 1.35rem; }
  header p { font-size: .85rem; opacity: .9; }
  .langs { margin-top: 8px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .langs button, #installBtn { background: rgba(255,255,255,.2); color: #fff; border: 1px solid #fff; border-radius: 20px; padding: 5px 12px; font-weight: bold; font-size: .85rem; }
  .langs button.active { background: #fff; color: #c0392b; }
  #installBtn { display: none; background: #f1c40f; color: #333; border-color: #f1c40f; }
  nav { display: flex; background: #e67e22; }
  nav button { flex: 1; padding: 12px 2px; border: none; background: none; color: #fff; font-size: .85rem; font-weight: bold; }
  nav button.active { background: #d35400; }
  main { padding: 14px; max-width: 700px; margin: auto; }
  #search { width: 100%; padding: 10px 14px; border-radius: 20px; border: 2px solid #e67e22; font-size: 1rem; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .card h3 { color: #c0392b; margin-bottom: 6px; }
  .card .icon { font-size: 2rem; float: right; margin-left: 8px; }
  .card p { line-height: 1.55; font-size: .95rem; }
  .q { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
  .opt { display: block; width: 100%; padding: 12px; margin: 6px 0; border: 2px solid #e67e22; border-radius: 10px; background: #fff; font-size: 1rem; text-align: left; color: #333; }
  .opt.right { background: #2ecc71; color: #fff; border-color: #27ae60; }
  .opt.wrong { background: #e74c3c; color: #fff; border-color: #c0392b; }
  .btn { background: #c0392b; color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-size: 1rem; margin: 10px 4px 0; }
  .btn.alt { background: #e67e22; }
  .level { display: block; width: 100%; margin: 8px 0; padding: 16px; font-size: 1.1rem; }
  .center { text-align: center; }
  .big { font-size: 3rem; }
  .bar { height: 8px; background: #f3d9c0; border-radius: 4px; margin: 6px 0 14px; overflow: hidden; }
  .bar div { height: 100%; background: #e67e22; transition: width .3s; }
  footer { text-align: center; font-size: .75rem; color: #999; padding: 20px; }
</style>
</head>
<body>
<div class="top">
  <header>
    <h1 id="title"></h1>
    <p id="sub"></p>
    <div class="langs">
      <button data-lang="hi" onclick="setLang('hi')">हिंदी</button>
      <button data-lang="en" onclick="setLang('en')">English</button>
      <button data-lang="bh" onclick="setLang('bh')">भोजपुरी</button>
      <button id="installBtn" onclick="installApp()"></button>
    </div>
  </header>
  <nav>
    <button data-tab="places" onclick="show('places')"></button>
    <button data-tab="people" onclick="show('people')"></button>
    <button data-tab="culture" onclick="show('culture')"></button>
    <button data-tab="quiz" onclick="show('quiz')"></button>
  </nav>
</div>
<main id="content"></main>
<footer>Bihar Heritage · बिहार धरोहर</footer>

<script src="data.js"></script>
<script>
let lang = localStorage.getItem('lang') || 'hi';
let tab = 'places';
let query = '';
let level = null, qi = 0, score = 0, list = [];
let installPrompt = null;

const t = k => UI[k][lang];
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  render();
}

function show(name) {
  tab = name;
  query = '';
  if (name === 'quiz') level = null;
  render();
  scrollTo(0, 0);
}

function render() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'hi';
  title.textContent = t('title');
  sub.textContent = t('sub');
  installBtn.textContent = t('install');
  document.querySelectorAll('.langs [data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.querySelectorAll('nav button').forEach(b => {
    b.textContent = t(b.dataset.tab);
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  if (tab === 'quiz') return renderQuiz();
  content.innerHTML = `<input id="search" type="search" placeholder="${t('search')}" value="${query}" oninput="query=this.value; renderCards()"><div id="cards"></div>`;
  renderCards();
}

function renderCards() {
  const q = query.trim().toLowerCase();
  const items = DATA[tab].filter(d => !q || [d.en, d.hi, d.bh].flat().join(' ').toLowerCase().includes(q));
  cards.innerHTML = items.length
    ? items.map(d => `<div class="card"><span class="icon">${d.i}</span><h3>${d[lang][0]}</h3><p>${d[lang][1]}</p></div>`).join('')
    : `<p class="center">${t('none')}</p>`;
}

// ---------- Quiz ----------
function startQuiz(lv) {
  level = lv; qi = 0; score = 0;
  const pool = lv === 'mixed' ? [...QUIZ.easy, ...QUIZ.hard] : QUIZ[lv];
  list = shuffle(pool).slice(0, 10).map(q => {
    // shuffle options too, keep track of the right answer
    const idx = shuffle([0, 1, 2, 3]);
    return { q: q.q, o: { en: idx.map(i => q.o.en[i]), hi: idx.map(i => q.o.hi[i]) }, a: idx.indexOf(q.a) };
  });
  renderQuiz();
}

function renderQuiz() {
  if (!level) {
    const best = lv => localStorage.getItem('best_' + lv) || 0;
    content.innerHTML = `<div class="card center"><div class="big">🏆</div><p class="q">${t('pick')}</p>
      ${['easy', 'hard', 'mixed'].map(lv => `<button class="btn level ${lv === 'mixed' ? 'alt' : ''}" onclick="startQuiz('${lv}')">${t(lv)} · ⭐ ${best(lv)}/10</button>`).join('')}</div>`;
    return;
  }
  if (qi >= list.length) {
    const key = 'best_' + level;
    const best = Math.max(score, +localStorage.getItem(key) || 0);
    localStorage.setItem(key, best);
    const [emoji, msg] = score >= 8 ? ['🏆', 'great'] : score >= 5 ? ['🌟', 'good'] : ['📖', 'tryMore'];
    content.innerHTML = `<div class="card center"><div class="big">${emoji}</div>
      <p class="q">${t(msg)}</p>
      <p>${t('scoreTxt')}: <b>${score} / ${list.length}</b></p>
      <p>${t('best')}: ${best}</p>
      <button class="btn" onclick="startQuiz('${level}')">${t('again')}</button>
      <button class="btn alt" onclick="level=null; renderQuiz()">${t('home')}</button></div>`;
    return;
  }
  const q = list[qi];
  const opts = q.o[lang === 'en' ? 'en' : 'hi'];
  content.innerHTML = `<div class="card">
    <p>${t('qOf')} ${qi + 1} / ${list.length} · ⭐ ${score}</p>
    <div class="bar"><div style="width:${qi / list.length * 100}%"></div></div>
    <p class="q">${q.q[lang]}</p>
    ${opts.map((o, i) => `<button class="opt" onclick="answer(${i})">${o}</button>`).join('')}
    <div id="nextBox"></div></div>`;
}

function answer(i) {
  const q = list[qi];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add('right');
  if (i === q.a) score++; else btns[i].classList.add('wrong');
  if (navigator.vibrate) navigator.vibrate(i === q.a ? 40 : [60, 40, 60]);
  nextBox.innerHTML = `<button class="btn" onclick="qi++; renderQuiz()">${t('next')}</button>`;
}

// ---------- Install as app ----------
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  installBtn.style.display = 'inline-block';
});
function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  installPrompt.userChoice.finally(() => { installPrompt = null; installBtn.style.display = 'none'; });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
</body>
</html>
